version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # SvelteKit, svelte-check and typescript-eslint don't support TypeScript 7 yet
      - dependency-name: "typescript"
        versions: [ ">=7" ]
      # v3+ needs remark 13+, mdsvex still uses remark-parse 8
      - dependency-name: "remark-footnotes"
        versions: [ ">=3" ]
    groups:
      npm-minor-and-patch:
        update-types: [ "minor", "patch" ]
      npm-major:
        update-types: [ "major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
